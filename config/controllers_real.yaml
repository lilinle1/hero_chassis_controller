controller:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100

  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    publish_rate: 50
    wheel_track: 0.4
    wheel_base: 0.4
    wheel_radius: 0.07625
    cmd_vel_timeout: 0.5
    velocity_mode: "base"
    enable_acc_limit: true
    max_linear_acc: 2.0
    max_angular_acc: 3.0
    front_left_joint: "left_front_wheel_joint"
    front_right_joint: "right_front_wheel_joint"
    back_left_joint: "left_back_wheel_joint"
    back_right_joint: "right_back_wheel_joint"
    pid_lf:
      p: 0.0
      i: 0.0
      d: 0.0
      i_clamp_min: -2.0
      i_clamp_max: 2.0
      antiwindup: true
    pid_rf:
      p: 0.0
      i: 0.0
      d: 0.0
      i_clamp_min: -2.0
      i_clamp_max: 2.0
      antiwindup: true
    pid_lb:
      p: 0.0
      i: 0.0
      d: 0.0
      i_clamp_min: -2.0
      i_clamp_max: 2.0
      antiwindup: true
    pid_rb:
      p: 0.0
      i: 0.0
      d: 0.0
      i_clamp_min: -2.0
      i_clamp_max: 2.0
      antiwindup: true
